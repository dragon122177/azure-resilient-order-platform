name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include the smallest reproducible example and correlation ID when available.
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Commit SHA or version }
    validations: { required: true }
  - type: textarea
    id: logs
    attributes: { label: Sanitized logs }
